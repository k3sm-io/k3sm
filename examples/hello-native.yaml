# k3sm M0 demo — a Kubernetes Pod that runs as a NATIVE macOS process
# (no Linux, no container, no VM) via the HostProcess Virtual Kubelet provider.
#
#   kubectl apply -f examples/hello-native.yaml
#   kubectl get pods -o wide          # Running on the k3sm darwin node
#   pgrep -fl tail                    # the real native process on your Mac
#   kubectl delete pod hello-native   # provider SIGKILLs the process group
#
# container.command/args is the native argv; the `image` field is a placeholder
# (native macOS workloads have no image ecosystem yet — that arrives in M1).
apiVersion: v1
kind: Pod
metadata:
  name: hello-native
  namespace: default
spec:
  nodeName: k3sm-m0          # pin to the k3sm node (no scheduler needed for the demo)
  restartPolicy: Never
  tolerations:
  - operator: Exists
  containers:
  - name: hello
    image: native            # placeholder; the command below is what runs
    command:
    - /bin/sh
    - -c
    - |
      echo 'hello from a k3sm NATIVE pod'
      /usr/bin/sw_vers
      echo started-ok
      exec /usr/bin/tail -f /dev/null
