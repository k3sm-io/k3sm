# metrics-server, the resource-metrics API (metrics.k8s.io) behind `kubectl top`
# and HPA on cpu/memory. Shipped the way k3s ships it: applied on every server
# start by the embedded add-on reconciler (pkg/addons), never from disk.
#
# Vendored from upstream metrics-server v0.9.0:
#   https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/components.yaml
#   sha256 1cec29a5267809306a2c6ec74a3e449abbb705b4a8beed0c8a1963910f72c79b
# The ServiceAccount, both ClusterRoles, all three bindings, the Service and the
# APIService are byte-for-byte that release (upstream RBAC verbatim, nothing
# wider). The Deployment differs ONLY in these lines, each needed to run
# metrics-server as a native pod on a Darwin server node:
#   - image pinned by digest           k3sm's native darwin/arm64 build of the
#                                      same v0.9.0 source, built from the pinned
#                                      module by hack/images/metrics-server/
#                                      (image.yaml is the one digest record)
#   - nodeSelector kubernetes.io/os: darwin (was linux; k3sm nodes are darwin)
#   - toleration k3sm.io/provider      the NoSchedule taint on every k3sm node
#   - node affinity on node-role.kubernetes.io/control-plane=true: server nodes
#     only, the label each server sets on its own Node (keeps the token off workers)
#   - automountServiceAccountToken: true, explicit: the scrape authenticates
#     with this ServiceAccount's token
#   - securityContext runAsUser removed: k3sm admission refuses a foreign uid on
#     every pod.
#   - securityContext runAsNonRoot removed: a native pod runs as the node's fixed
#     _k3sm uid by construction, and a FROM-scratch image carries no numeric USER
#     for the kubelet-side check to read.
# No runtimeClassName: the pod is native, not a vm pod. The args are upstream's,
# unchanged: --metric-resolution stays at 15s, and there is no
# --kubelet-insecure-tls.
#
# The kubelet scrape authenticates with this ServiceAccount's token: the k3sm
# kubelet endpoint admits a bearer token on /metrics/resource only after a
# TokenReview and a nodes/metrics SubjectAccessReview against the apiserver.
# It verifies each node's serving cert against the pod's in-cluster CA bundle
# (kube-root-ca.crt). On a multi-node cluster that is the cluster CA, which
# issues every node's kubelet serving cert with its InternalIP as a SAN, as on
# k3s. A single-node install's kubelet cert is self-signed and does not verify.
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    k8s-app: metrics-server
  name: metrics-server
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    k8s-app: metrics-server
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-view: "true"
  name: system:aggregated-metrics-reader
rules:
- apiGroups:
  - metrics.k8s.io
  resources:
  - pods
  - nodes
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    k8s-app: metrics-server
  name: system:metrics-server
rules:
- apiGroups:
  - ""
  resources:
  - nodes/metrics
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - pods
  - nodes
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    k8s-app: metrics-server
  name: metrics-server-auth-reader
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
- kind: ServiceAccount
  name: metrics-server
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    k8s-app: metrics-server
  name: metrics-server:system:auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: metrics-server
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    k8s-app: metrics-server
  name: system:metrics-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:metrics-server
subjects:
- kind: ServiceAccount
  name: metrics-server
  namespace: kube-system
---
apiVersion: v1
kind: Service
metadata:
  labels:
    k8s-app: metrics-server
  name: metrics-server
  namespace: kube-system
spec:
  ports:
  - appProtocol: https
    name: https
    port: 443
    protocol: TCP
    targetPort: https
  selector:
    k8s-app: metrics-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    k8s-app: metrics-server
  name: metrics-server
  namespace: kube-system
spec:
  selector:
    matchLabels:
      k8s-app: metrics-server
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  template:
    metadata:
      labels:
        k8s-app: metrics-server
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: In
                values:
                - "true"
      automountServiceAccountToken: true
      containers:
      - args:
        - --cert-dir=/tmp
        - --secure-port=10250
        - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
        - --kubelet-use-node-status-port
        - --metric-resolution=15s
        image: ghcr.io/k3sm-io/metrics-server@sha256:2334cdb7df40b9efea2af2dc7444f16b715f6ee025fb849070e424f6900ad743
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /livez
            port: https
            scheme: HTTPS
          periodSeconds: 10
        name: metrics-server
        ports:
        - containerPort: 10250
          name: https
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: https
            scheme: HTTPS
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          # runAsNonRoot omitted: native pods run as the fixed _k3sm uid; the scratch image has no USER.
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /tmp
          name: tmp-dir
      nodeSelector:
        kubernetes.io/os: darwin
      priorityClassName: system-cluster-critical
      serviceAccountName: metrics-server
      tolerations:
      - effect: NoSchedule
        key: k3sm.io/provider
        operator: Exists
      volumes:
      - emptyDir: {}
        name: tmp-dir
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  labels:
    k8s-app: metrics-server
  name: v1beta1.metrics.k8s.io
spec:
  group: metrics.k8s.io
  groupPriorityMinimum: 100
  insecureSkipTLSVerify: true
  service:
    name: metrics-server
    namespace: kube-system
  version: v1beta1
  versionPriority: 100
