# k3sm upstream-image mirror — STAGED entries (not yet consumed by any pin constant).
#
# Same entry schema as mirror.yaml (name, upstream, mirror, tag, platforms). Entries sit
# here, and NOT in mirror.yaml, because mirror.yaml is held 1:1 against the pin constants
# in pkg/images by TestLockstepShippedManifest: an entry there with no paired constant is
# an ORPHAN and reds `go test ./pkg/images/...`, and the manifest is parsed strictly, so a
# marked sub-block inside mirror.yaml would be a schema error rather than an ignored one.
# This file is read by hack/images/mirror-images.sh (so the copy can run before any
# product code consumes the digest) and by nothing in Go.
#
# PROMOTION: when product code consumes one of these (for M16: values-k3sm.yaml pins the
# chart and the three images, and m16.0 asserts the digests), move the entry into
# mirror.yaml in the SAME PR that adds its pkg/images constant. The chart entry carries
# no platforms (a Helm chart is a single OCI manifest, not an index), which mirror.yaml's
# schema does not yet admit; promoting it is a schema decision for that PR.
#
# Every digest below was resolved anonymously against nvcr.io on 2026-10-22 with the
# registry v2 manifests endpoint, and cross-checked by sha256 of the returned body
# (the chart also by `helm pull oci://...@sha256:...`). The same bump rules apply as in
# mirror.yaml's header, including the reviewer's independent re-resolution.

images:
  # M16 R12: the upstream serving control plane's Helm chart. It is published as an OCI
  # chart at nvcr.io/nvidia/ai-dynamo/dynamo-platform, NOT under .../charts/ (that path
  # has no repository: the anonymous token endpoint answers 400).
  # The chart is staged at 1.5.0, not 1.5.1: nvcr.io publishes no 1.5.1 OCI chart (its tag
  # list stops at 1.5.0). The 1.5.1 chart exists only in NVIDIA's NGC Helm repository; it
  # differs from 1.5.0 by the version strings and the image tag defaults, and the
  # operator's CRDs and ClusterRole render identically. The images below are at 1.5.1.
  - name: dynamo-platform
    upstream: nvcr.io/nvidia/ai-dynamo/dynamo-platform:1.5.0@sha256:ff09c3bdfb26fb6b9274917a80c0fdf9bf23eeb02912988262ac5f87a5860714
    mirror: ghcr.io/k3sm-io/mirror/dynamo-platform@sha256:ff09c3bdfb26fb6b9274917a80c0fdf9bf23eeb02912988262ac5f87a5860714
    tag: 1.5.0

  # M16 R12: the operator. The index also carries two attestation manifests
