# The metrics-server add-on image: the ONE record of its digest. The embedded
# manifest (pkg/addons/manifests/metrics-server.yaml) carries a checked copy of
# image.ref; pkg/addons TestMetricsServerImageLockstep reds on any difference,
# and `build.sh --live` resolves image.ref anonymously in the registry.
#
# Produced by build.sh (README.md). `k3sm build` writes one darwin/arm64 image
# manifest and `k3sm image push` publishes it as is, so there is no image index:
# image.index is empty and image.ref pins the darwin/arm64 manifest.
#
# published: true means image.ref names the artifact pushed to the registry;
# `build.sh --live` resolves it anonymously and must succeed. A rebuild that
# records new digests sets published: false until the operator pushes it,
# makes it public and re-derives the digest from the published artifact.
