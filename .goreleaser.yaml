# k3sm goreleaser config — UNSIGNED SNAPSHOT (build shape only).
#
# This config proves the RELEASE ARTIFACT SHAPE for the single k3sm binary. It is
# deliberately an unsigned snapshot: codesigning/notarization and the Homebrew-tap
# push require signing credentials held outside this repo and are stubbed-disabled
# below (goreleaser schema-validates live `signs:`/`notarize:`/`brews:` stanzas
# against certs/tokens that are absent in this repo, so they are kept as commented
# reference blocks).
#
# The live archive proof runs in CI (goreleaser is not installed in the lab); the
# local acceptance gate hack/acceptance/B58.sh reports PENDING when the tool is
# absent and exits non-zero so red-at-main stays provable.
version: 2

project_name: k3sm

before:
  hooks:
    - go mod download

builds:
  # ONE build entry: the single k3sm Mach-O (DESIGN §6, one-Mach-O doctrine).
  # k3sm-netd is NOT a second build — there is no cmd/k3sm-netd package; netd is
  # the `k3sm netd` subcommand (the launchd plist execs `k3sm netd`, see
  # pkg/install/install.go). It ships as a renamed COPY of this same binary,
  # staged by the post-build hook below.
  - id: k3sm
    main: ./cmd/k3sm
    binary: k3sm
    goos: [darwin]
    goarch: [arm64]
    env:
      # CGO=1 is required by runtimed's darwin-SPI imports (the durable reason);
      # it is NOT for kine — kine goes pure-Go under the modern-stack reset.
      - CGO_ENABLED=1
    # Target the pkg/version vars (B57). goreleaser's default -X main.version
    # no-ops here (there is no main.version symbol → it would render "dev").
    # -trimpath keeps absolute build paths off a CGO=1 binary, so two builds of
    # one tag differ by as little as the toolchain allows.
    flags:
      - -trimpath
    # Target the pkg/version vars (B57). goreleaser's default -X main.version
    # no-ops here (there is no main.version symbol → it would render "dev").
    #
    # The three sibling *Commit stamps carry provenance build info CANNOT: this
    # module's go.mod holds permanent filesystem `replace` directives onto the
    # sibling checkouts, and a directory replacement has an empty module version,
    # so debug.ReadBuildInfo can only ever report "(devel)" for them. The release
    # tooling supplies the four commit SHAs it just verified clean and synced.
    ldflags:
      - -s -w
      - -X k3sm.io/k3sm/pkg/version.Version={{.Version}}
      - -X k3sm.io/k3sm/pkg/version.Commit={{.Commit}}
      - -X k3sm.io/k3sm/pkg/version.Date={{.Date}}
      # envOrDefault, not .Env.X: a bare .Env lookup is a hard template error when
      # the key is unset, which would break every snapshot build that is not a
      # release (the archive-shape gate, a local `goreleaser build`).
      - -X k3sm.io/k3sm/pkg/version.APISCommit={{ envOrDefault "K3SM_APIS_COMMIT" "" }}
      - -X k3sm.io/k3sm/pkg/version.DarwinNetCommit={{ envOrDefault "K3SM_DARWIN_NET_COMMIT" "" }}
      - -X k3sm.io/k3sm/pkg/version.RuntimedCommit={{ envOrDefault "K3SM_RUNTIMED_COMMIT" "" }}
    hooks:
      # Stage k3sm-netd as a renamed copy of the built single Mach-O so the
      # archive can include it without a second (non-existent) build.
      post:
        - cp "{{ .Path }}" "{{ dir .Path }}/k3sm-netd"

archives:
  - id: k3sm
    ids: [k3sm]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      # The k3sm binary is auto-included from the build; stage the netd copy and
      # the legal files. This is the honestly-stageable SNAPSHOT set — only what
      # an in-tree producer exists for.
      # k3sm-netd is a byte-identical copy of the single k3sm Mach-O (one-Mach-O
      # doctrine). NOTE: the installed launchd plist execs `k3sm netd` (the
      # subcommand of the primary binary — pkg/install/install.go), so this copy
      # is not the root-executed path today; it is shipped to satisfy the archive
      # manifest. Whether the signing/notarization slice installs it as a distinct
      # helper or drops it is a human decision recorded with that work.
      # strip_parent flattens the nested dist/... source path to the archive root
      # so the tar member is `k3sm-netd`, not `dist/.../k3sm-netd`.
      - src: "dist/k3sm_darwin_arm64*/k3sm-netd"
        strip_parent: true
        info:
          mode: 0755
      - LICENSE
      - NOTICE
      # --- The supporting artifacts `k3sm install` fail-fasts on. Their producer
      # --- is hack/release/stage.sh, which builds them into build/stage/ BEFORE
      # --- goreleaser runs (staging cannot live under dist/ — goreleaser owns
      # --- that directory and --clean empties it).
      #
      # The set and its layout are NOT re-typed here from memory: they are
      # pkg/install.RequiredSiblings, printed by `k3sm install
      # --print-required-artifacts`, and the release gate asserts this archive's
      # member list against that output. Adding an artifact there reddens the
      # gate until a member appears here.
      #
      # Root-level members: strip_parent flattens the staging path, and NO dst,
      # so the tar member is `k3sm-execshim`, resolved beside the binary.
      - src: "build/stage/k3sm-execshim"
        strip_parent: true
        info:
          mode: 0755
      - src: "build/stage/libk3sm_pathrebase_shim.dylib"
        strip_parent: true
        info:
          mode: 0755
      - src: "build/stage/libk3sm_getaddrinfo_shim.dylib"
        strip_parent: true
        info:
          mode: 0755
      # Payload members: dst places them under cp-payload/ (install resolves
      # PayloadSource at <binary dir>/cp-payload), strip_parent drops the staging
      # prefix. Without BOTH, the members land at the archive root and install
      # fail-fasts with "run `k3sm payload` first".
      - src: "build/stage/cp-payload/*"
        dst: cp-payload
        strip_parent: true
        info:
          mode: 0755

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

release:
  # Draft by default: the archive is ~250 MB over a home uplink, and GitHub's
  # `releases/latest` — which install.sh resolves when no version is pinned —
  # skips drafts. A failed or partial upload therefore stays invisible to users
  # instead of becoming the release every `curl | sh` installs. The publish step
  # promotes the draft only after the post-publish verify passes.
  draft: true
  # `-rc.N` tags must never become `releases/latest` while a stable release
  # exists; prerelease marking is what keeps the gen-1 curl channel off them.
  prerelease: auto

snapshot:
  # Keep snapshot versions from colliding with real tags.
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

